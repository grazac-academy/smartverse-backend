<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SmartVert</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            max-width: 440px;
            width: 100%;
            border: 1px solid #334155;
        }
        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 8px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: #10b981;
        }
        .btn {
            width: 100%;
            padding: 13px;
            background: #10b981;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            margin-top: 8px;
        }
        .btn:hover {
            background: #059669;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .message.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #6ee7b7;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">SmartVert</div>
        <h1>Reset Your Password</h1>
        <p class="subtitle">Enter a new password for your account below.</p>

        <form id="resetForm">
            <input type="hidden" id="token" value="{{token}}">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="8" placeholder="Minimum 8 characters">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required minlength="8" placeholder="Re-enter new password">
            </div>
            <button type="submit" class="btn" id="submitBtn">Set New Password</button>
            <div id="msg" class="message"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('resetForm');
        const token = document.getElementById('token').value;
        const msg = document.getElementById('msg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.className = 'message';
            msg.style.display = 'none';

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                msg.className = 'message error';
                msg.textContent = 'Passwords do not match.';
                return;
            }

            if (newPassword.length < 8) {
                msg.className = 'message error';
                msg.textContent = 'Password must be at least 8 characters long.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating password...';

            try {
                const res = await fetch('/api/v1/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: newPassword })
                });

                const data = await res.json();

                if (res.ok && data.success !== false) {
                    form.innerHTML = `
                        <div class="message success">
                            <strong>Password updated successfully!</strong><br>
                            You can now close this window and log in to SmartVert with your new password.
                        </div>
                    `;
                } else {
                    msg.className = 'message error';
                    msg.textContent = data.message || 'Failed to reset password. Link may be invalid or expired.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Set New Password';
                }
            } catch (err) {
                msg.className = 'message error';
                msg.textContent = 'An error occurred while connecting to the server.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Set New Password';
            }
        });
    </script>
</body>
</html>
